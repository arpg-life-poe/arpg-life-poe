name: Build macOS Release (PoE 1 & PoE 2)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      target:
        description: 'Target to build (poe1, poe2, or all)'
        required: true
        default: 'all'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14
    strategy:
      matrix:
        target: [poe1, poe2]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools & dependencies
        run: |
          brew install cmake ninja pkg-config sdl3 luajit libzstd

      - name: Sync upstream repositories
        run: |
          ./scripts/sync_upstream.sh

      - name: Build and Package macOS App
        run: |
          ./scripts/build_macos.sh ${{ matrix.target }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pob-${{ matrix.target }}-macos-arm64
          path: dist/${{ matrix.target }}-macos-arm64/*
